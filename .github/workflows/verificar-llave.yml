# Comprueba que el secret LLAVE_PIPELINE sirve para entrar al servidor.
# No despliega ni cambia nada: solo se conecta por SSH y muestra datos del servidor.
# Se ejecuta a mano: pestaña Actions → "Verificar llave del servidor" → Run workflow.

name: Verificar llave del servidor

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: 52.72.14.150
    steps:
      - name: Revisar el formato de la llave
        env:
          LLAVE_PIPELINE: ${{ secrets.LLAVE_PIPELINE }}
        run: |
          test -n "$LLAVE_PIPELINE" || { echo "El secret LLAVE_PIPELINE está vacío o no existe"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LLAVE_PIPELINE" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | grep -q "BEGIN" || { echo "La llave no empieza con la línea -----BEGIN ...-----"; exit 1; }
          tail -1 ~/.ssh/deploy_key | grep -q "END" || { echo "La llave no termina con la línea -----END ...-----"; exit 1; }
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "El contenido no es una llave privada válida"; exit 1; }
          echo "Formato correcto"

      - name: Conectarse al servidor
        run: |
          echo "$EC2_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP5sDOPmWI9E2RDd1W0CK94K0KxULCEoVS2WylOYta3E" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 ubuntu@$EC2_HOST \
            'echo "Conexión correcta con $(hostname)"; systemctl is-active travelers'

      - name: Limpiar la llave
        if: always()
        run: rm -f ~/.ssh/deploy_key
