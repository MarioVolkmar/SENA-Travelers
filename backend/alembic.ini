# Configuración de Alembic (migraciones de la base de datos).
# La conexión NO va aquí: se toma del .env (DB_HOST, DB_USER, DB_PASSWORD, DB_NAME), igual que la app.
#
# Comandos (desde la carpeta backend, con el venv activo):
#   alembic upgrade head                         aplica las migraciones que falten
#   alembic current                              muestra en qué migración está la base
#   alembic history                              lista todas las migraciones
#   alembic revision --autogenerate -m "texto"   crea una migración comparando modelos y base
#   alembic downgrade -1                         revierte la última migración

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
